name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - name: Build and embed admin UI
        run: ./scripts/build-web.sh
      - name: Check admin client safety behavior
        working-directory: web
        run: pnpm test
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --test evals/evaluate.test.mjs
      - run: go run ./cmd/soseekd check --config deploy/config.example.json
      - run: docker build -t soseek:ci .
